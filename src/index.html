<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 12px;
        }

        /* Handle de arrastre nativo de Windows */
        #drag-handle {
            width: 100%;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: drag;
            cursor: move;
            color: rgba(0,0,0,0.22);
            font-size: 12px;
            letter-spacing: 4px;
            flex-shrink: 0;
        }
        #drag-handle:hover { color: rgba(0,0,0,0.45); }

        #bubble {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 8px;
            width: 290px;
            max-height: 270px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            font-size: 12px;
            color: #24292f;
            position: relative;
            -webkit-app-region: no-drag;
            overflow-y: auto;
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1), transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s;
        }

        #bubble.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(12px);
        }

        #bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.96) transparent transparent;
        }

        /* Notificación Toast */
        #toast-msg {
            display: none;
            background: #1e293b;
            color: #f8fafc;
            font-size: 10px;
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .title-conflict { color: #b91c1c; }
        .title-review { color: #d97706; }
        .title-rereview { color: #2563eb; }
        .title-action { color: #dc2626; }

        .alert-item {
            margin-bottom: 6px;
            padding: 6px 8px;
            background: #f6f8fa;
            border-radius: 6px;
            border-left: 3px solid #d0d7de;
        }

        .alert-item a {
            color: #0969da;
            text-decoration: none;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .alert-item a:hover { text-decoration: underline; }

        .alert-detail {
            color: #57606a;
            display: block;
            font-size: 10px;
            margin-top: 3px;
        }

        .alert-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .btn-action-ai {
            background: #f0fdf4;
            border: 1px solid #86efac;
            color: #15803d;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            padding: 3px 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            -webkit-app-region: no-drag;
            transition: background 0.15s;
        }
        .btn-action-ai:hover { background: #dcfce7; }
        .btn-action-ai:disabled { opacity: 0.6; cursor: wait; }

        .btn-action-conflict {
            background: #fef2f2;
            border-color: #fca5a5;
            color: #b91c1c;
        }
        .btn-action-conflict:hover { background: #fee2e2; }

        .empty-state {
            color: #57606a;
            font-size: 11px;
            padding: 8px 0;
            text-align: center;
        }
        .happy-message { color: #059669; font-weight: 600; }

        .alert-filters {
            display: flex;
            gap: 5px;
            margin: 0 0 7px;
        }
        .filter-btn {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            color: #57606a;
            cursor: pointer;
            flex: 1;
            font-size: 10px;
            padding: 4px 5px;
            -webkit-app-region: no-drag;
        }
        .filter-btn.active {
            background: #ddf4ff;
            border-color: #0969da;
            color: #0969da;
            font-weight: 600;
        }

        .token-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .token-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 11px;
            font-family: monospace;
            outline: none;
            -webkit-app-region: no-drag;
        }

        .token-input:focus {
            border-color: #0969da;
            box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
        }

        .btn-primary {
            background: #2da44e;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            -webkit-app-region: no-drag;
        }
        .btn-primary:hover { background: #2c974b; }

        .btn-secondary {
            background: #f6f8fa;
            color: #24292f;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 5px;
            font-size: 10px;
            cursor: pointer;
            margin-top: 4px;
            text-align: center;
            display: block;
            text-decoration: none;
            -webkit-app-region: no-drag;
        }
        .btn-secondary:hover { background: #eaedf0; }

        /* Auto-Pilot Checkbox Box */
        .autopilot-box {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .autopilot-option {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 10px;
            color: #166534;
            cursor: pointer;
            line-height: 1.3;
        }
        .autopilot-option input { cursor: pointer; margin-top: 2px; }

        /* Plantillas de IA Formulario */
        .template-field { margin-bottom: 8px; }
        .template-label {
            font-size: 10px;
            font-weight: 600;
            color: #24292f;
            margin-bottom: 2px;
            display: block;
        }
        .template-textarea {
            width: 100%;
            height: 45px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            font-size: 9px;
            font-family: monospace;
            padding: 4px;
            resize: vertical;
            outline: none;
            -webkit-app-region: no-drag;
        }
        .template-textarea:focus { border-color: #0969da; }

        /* Historial de tokens */
        #token-history-list { display: none; margin-top: 6px; }
        #token-history-list .history-label { font-size: 10px; color: #57606a; margin-bottom: 4px; }
        .token-chip {
            display: inline-block;
            margin: 2px;
            padding: 3px 8px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            font-size: 10px;
            color: #0969da;
            cursor: pointer;
            white-space: nowrap;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            -webkit-app-region: no-drag;
        }
        .token-chip:hover { background: #ddf4ff; border-color: #0969da; }

        /* Botón Marcar como Visto */
        .btn-seen {
            background: none;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            color: #57606a;
            font-size: 9px;
            padding: 2px 5px;
            cursor: pointer;
            float: right;
            margin-left: 4px;
            flex-shrink: 0;
            line-height: 1.4;
            -webkit-app-region: no-drag;
        }
        .btn-seen:hover { background: #f0fdf4; border-color: #10b981; color: #10b981; }
        .btn-unseen:hover { background: #fff7ed; border-color: #f59e0b; color: #b45309; }

        /* Contenedor de la mascota fijo y siempre visible */
        #pet-container {
            position: relative;
            display: inline-block;
            -webkit-app-region: drag;
            cursor: move;
            padding: 4px;
            margin-top: 4px;
        }

        #badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 10;
            line-height: 1;
            pointer-events: none;
        }

        /* Mascota CSS */
        #pet {
            width: 80px;
            height: 80px;
            position: relative;
            cursor: move;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-app-region: drag;
        }

        #pet:hover { transform: scale(1.08); }

        .body {
            width: 62px;
            height: 52px;
            background: #10b981;
            border-radius: 50% 50% 42% 42%;
            position: absolute;
            bottom: 0;
            left: 9px;
            transition: background 0.4s;
        }

        .head {
            width: 52px;
            height: 46px;
            background: #10b981;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 14px;
            transition: background 0.4s;
        }

        .ear {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #10b981;
            position: absolute;
            top: -6px;
            transition: border-color 0.4s;
        }

        .ear.left { left: 14px; transform: rotate(-22deg); }
        .ear.right { right: 14px; transform: rotate(22deg); }

        .eye {
            width: 7px;
            height: 7px;
            background: #1f2937;
            border-radius: 50%;
            position: absolute;
            top: 18px;
            animation: blink 4s infinite;
        }

        .eye.left { left: 14px; }
        .eye.right { right: 14px; }

        .nose {
            width: 4px;
            height: 3px;
            background: #ec4899;
            border-radius: 50%;
            position: absolute;
            top: 24px;
            left: 24px;
        }

        /* Estados de color */
        .state-happy .body, .state-happy .head { background: #10b981; }
        .state-happy .ear { border-bottom-color: #10b981; }

        .state-alert .body, .state-alert .head { background: #f59e0b; }
        .state-alert .ear { border-bottom-color: #f59e0b; }

        .state-rereview .body, .state-rereview .head { background: #3b82f6; }
        .state-rereview .ear { border-bottom-color: #3b82f6; }

        .state-action .body, .state-action .head { background: #ef4444; }
        .state-action .ear { border-bottom-color: #ef4444; }

        .state-conflict .body, .state-conflict .head { background: #991b1b; }
        .state-conflict .ear { border-bottom-color: #991b1b; }

        .state-working .body, .state-working .head { background: #8b5cf6; }
        .state-working .ear { border-bottom-color: #8b5cf6; }

        .state-disconnected .body, .state-disconnected .head { background: #9ca3af; }
        .state-disconnected .ear { border-bottom-color: #9ca3af; }

        /* Animaciones */
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
        @keyframes jump-alert {
            0% { transform: translateY(0) scale(1); }
            20% { transform: translateY(-16px) scale(1.12); }
            40% { transform: translateY(0) scale(0.96); }
            55% { transform: translateY(-8px) scale(1.06); }
            70% { transform: translateY(0) scale(1); }
            85% { transform: translateY(-3px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }
        @keyframes flash-glow {
            0% { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25)); }
            30% { filter: drop-shadow(0 0 22px rgba(245,158,11,0.95)) brightness(1.25); }
            60% { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25)); }
            80% { filter: drop-shadow(0 0 14px rgba(245,158,11,0.7)); }
            100% { filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25)); }
        }

        .anim-bounce { animation: bounce 1.8s ease-in-out infinite; }
        .anim-new-alert {
            animation: jump-alert 0.75s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards,
                       flash-glow 0.75s ease-in-out forwards !important;
        }

        @keyframes happy-hop {
            0%, 100% { transform: translateY(0) rotate(0); }
            25% { transform: translateY(-9px) rotate(-4deg); }
            50% { transform: translateY(0) rotate(0); }
            75% { transform: translateY(-6px) rotate(4deg); }
        }
        .anim-happy { animation: happy-hop 0.9s ease-in-out 2; }
    </style>
</head>
<body class="state-disconnected">
    <div id="app">
        <!-- Handle de arrastre nativo -->
        <div id="drag-handle">⠿ ⠿ ⠿</div>

        <div id="bubble">
            <div id="toast-msg"></div>

            <!-- Sección de configuración de Token -->
            <div id="auth-section">
                <div style="font-weight:600; margin-bottom:6px;">🐾 Conectar a GitHub</div>
                <div style="font-size:11px; color:#57606a; margin-bottom:8px;">
                    Pega tu Personal Access Token (classic) con permisos <code>repo</code> y <code>read:user</code>:
                </div>
                <div class="token-input-group">
                    <input type="password" id="token-input" class="token-input" placeholder="ghp_..." autocomplete="off" />
                    <button id="save-token-btn" class="btn-primary" onclick="saveToken()">Guardar y Conectar</button>
                    <a href="#" class="btn-secondary" onclick="openTokenHelp()">🔑 Generar token en GitHub</a>
                </div>
                <div id="token-history-list">
                    <div class="history-label">🕐 Tokens recientes:</div>
                    <div id="token-chips"></div>
                </div>
                <div id="auth-error-msg" style="color:#cf222e; font-size:11px; margin-top:6px; display:none;"></div>
            </div>

            <!-- Sección de Configuración de Prompts e IA y Auto-Pilot -->
            <div id="ai-settings-section" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <div style="font-weight:700; font-size:11px;">🤖 Auto-Pilot y Prompts de IA</div>
                    <a href="#" onclick="showAlertsView()" style="font-size:10px; color:#0969da; text-decoration:none;">✕ Volver</a>
                </div>

                <!-- Toggle de Auto-Pilot -->
                <div class="autopilot-box">
                    <label class="autopilot-option">
                        <input type="checkbox" id="chk-autopilot" />
                        <div>
                            <strong>🚀 Modo Auto-Pilot Total:</strong>
                            <div style="font-size:9px; color:#15803d; margin-top:2px;">
                                En cuanto detecta un conflicto o feedback en un PR, crea un worktree, lo resuelve con IA, pasa los tests y hace push automáticamente a GitHub.
                            </div>
                        </div>
                    </label>
                </div>
                
                <div class="template-field">
                    <label class="template-label">🔍 Criterios de Code Review:</label>
                    <textarea id="tpl-review" class="template-textarea"></textarea>
                </div>

                <div class="template-field">
                    <label class="template-label">⚡ Plantilla de Mensaje de Commit:</label>
                    <textarea id="tpl-autofix" class="template-textarea"></textarea>
                </div>

                <div class="template-field">
                    <label class="template-label">🔀 Política de Conflictos de Merge:</label>
                    <textarea id="tpl-conflict" class="template-textarea"></textarea>
                </div>

                <div style="display:flex; gap:4px; margin-top:8px;">
                    <button class="btn-primary" onclick="saveAISettings()">Guardar Ajustes</button>
                    <button class="btn-secondary" style="margin-top:0;" onclick="resetAITemplates()">Restablecer</button>
                </div>
                <div id="ai-save-feedback" style="color:#059669; font-size:10px; margin-top:4px; display:none;">✅ Ajustes guardados correctamente</div>
            </div>

            <!-- Sección de Alertas -->
            <div id="alerts-section" style="display:none;">
                <div id="user-header" style="font-size:11px; color:#57606a; border-bottom:1px solid #d0d7de; padding-bottom:4px; margin-bottom:6px;"></div>
                <div class="alert-filters" role="tablist" aria-label="Filtro de alertas">
                    <button class="filter-btn active" data-filter="active" onclick="setAlertFilter('active')">Pendientes</button>
                    <button class="filter-btn" data-filter="viewed" onclick="setAlertFilter('viewed')">Vistos</button>
                    <button class="filter-btn" id="refresh-btn" onclick="refreshStatus()">↻ Actualizar</button>
                </div>
                <div id="alerts-list">Buscando PRs...</div>
                <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:10px;">
                    <a href="#" onclick="showAISettings()" style="color:#0969da; text-decoration:none;">🤖 Prompts & Auto-Pilot</a>
                    <a href="#" onclick="showSettings()" style="color:#57606a; text-decoration:none;">⚙️ Token</a>
                </div>
            </div>
        </div>

        <!-- Mascota con badge de pendientes (Fija y siempre visible) -->
        <div id="pet-container">
            <div id="badge">0</div>
            <div id="pet" class="anim-bounce">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="body"></div>
                <div class="head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                    <div class="nose"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
